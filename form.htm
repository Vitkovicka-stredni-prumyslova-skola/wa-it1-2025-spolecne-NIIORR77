<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style-form.css">

<body>
    <form>
        <label for="email">Jméno</label><br>
        <input type="text" name="name" id="name" placeholder="Vyplň své jméno"><br>
        <input type="button" value="Odeslat"><br>

        <label for="email">Příjmení</label><br>
        <input type="text" name="surname" id="surname" placeholder="Vyplň své příjmení"><br>
        <input type="button" value="Odeslat"><br>

        <label for="email">e-mail</label><br>
        <input type="text" name="email" id="email" placeholder="Vložte e-mail"><br>

        <p>Chcete být informováni o novinkách?</p>
        <input type="radio" name="news" id="ano" value="ano">
        <label for="ano">Ano</label><br>

        <input type="radio" name="news" id="ne" value="ne"> 
        <label for="ne">Ne</label> 

        <input type="button" value="Odeslat"> 
    </form>


    <form id="login">
        <label for="login">Login:</label>
        <input type="text" name="login" id="login" placeholder="Zadej svůj nick"> <br>

        <label for="password">Heslo:</label>
        <input type="password" name="password" id="password" placeholder="Zadej své heslo"> <br>

        <label for="holdlogin">Zůstat přihlášen?</label>
        <input type="checkbox" name="holdlogin" id="holdlogin" value="yes" marked> <br>
        <input type="submit" value="Přihlásit se">
     </form>
